name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 跑测试（全部走内存假客户端，不触网）
        run: python -m pytest

  secret-scan:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 确认 secrets.toml 没有被提交
        run: |
          if git ls-files --error-unmatch .streamlit/secrets.toml >/dev/null 2>&1; then
            echo "::error::.streamlit/secrets.toml 被提交进了仓库！请立即移除并轮换密钥。"
            exit 1
          fi
          echo "OK：secrets.toml 未入库"

      - name: 扫描疑似真实凭证字样
        run: |
          if grep -rIn --exclude-dir=.git -E '"(cli_[a-zA-Z0-9]{10,})"' --include='*.py' --include='*.toml' . ; then
            echo "::error::代码里疑似硬编码了 App ID，请改为从 secrets 读取。"
            exit 1
          fi
          echo "OK：未发现硬编码凭证"
